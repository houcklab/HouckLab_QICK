[project]
name = "qicklab"
version = "0.1.0"
description = "Houck Lab RFSoC (QICK) measurement framework for superconducting qubits"
requires-python = ">=3.11"
dependencies = [
    "qick==0.2.334",
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "pandas",
    "tqdm",
    "Pyro4",
    "pyvisa",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
twpa = ["pywindfreak"]
signalcore = ["Pyro5"]

[tool.setuptools]
packages = { find = { include = ["qicklab*", "devices*"] } }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = [".venv", ".claude", ".idea", "WorkingProjects"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: formatter owns line length. E741: I/Q are the physics names for quadratures.
# B905: zip(strict=) would change behaviour on length mismatch. B008: call-in-default is used deliberately.
ignore = ["E501", "E741", "B905", "B008"]

# Transitional (phases 3a-i..3a-iii: bodies move verbatim). Every entry is a legacy body-level
# finding that phase 3b removes with the code it sits in.
[tool.ruff.lint.per-file-ignores]
"qicklab/experiments/transmission.py" = ["F841"]
"qicklab/experiments/zero_span_parity.py" = ["F841"]
"qicklab/hardware/attenuator.py" = ["F821", "F841"]     # legacy NameError `result` (known bug, own fix commit)
"qicklab/runs/single_shot.py" = ["F841"]
"qicklab/twpa/flux_sweep.py" = ["F541"]
"qicklab/twpa/set_pump.py" = ["F541"]

[tool.ruff.lint.isort]
known-first-party = ["qicklab", "devices"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: long-running offline tests (deselect with -m 'not slow')",
    "hardware: requires the RFSoC / instruments (never run in CI)",
]
