# Runs Bob's test suite (WorkingProjects/triangle_lattice_quench/Bob/tests) on every push and pull request,
# on Linux, macOS and Windows. The GUI tests run without a screen (Qt "offscreen"); nothing here talks to an
# RFSoC. Each OS also saves screenshots of the GUI (Actions tab -> the run -> Artifacts) to check its look.
name: Bob tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: WorkingProjects/triangle_lattice_quench
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"            # test with each OS's own default text encoding
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: WorkingProjects/triangle_lattice_quench/Bob/requirements.txt

      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Bob's requirements
        run: python -m pip install -r Bob/requirements.txt

      - name: Run tests
        run: python -m pytest Bob/tests -v

      - name: Screenshots
        if: always()
        run: python -m Bob.tests.screenshots bob_screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bob-screenshots-${{ runner.os }}
          path: WorkingProjects/triangle_lattice_quench/bob_screenshots/
          if-no-files-found: ignore
